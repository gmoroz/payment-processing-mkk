services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localdev
    ports:
      - '127.0.0.1:${POSTGRES_PORT:?задайте POSTGRES_PORT в backend/.env}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
    volumes:
      - ./scripts/init_test_db.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
      - postgres_data:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:4.1.8-management-alpine
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:?задайте RABBITMQ_PORT в backend/.env}:5672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_listener', '5672']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
    volumes:
      - ./scripts/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./scripts/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data:
